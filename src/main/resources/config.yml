alerts:
  # Staff alerts are opt-in by permission unless broadcast is enabled.
  enabled: true
  broadcast: false
  print-to-console: true
  permission: phantom.alerts
  # Compatibility mode: keeps upgraded/old server configs on 1:1 staff alerts.
  # Set false to restore custom Grim-style threshold:interval alert rules.
  every-violation-alerts: true
  # Kept for configuration compatibility; Grim's active-VL alert model is not time-debounced.
  alert-interval-ticks: 0
  # VL added by each exhaustively-impossible observation.
  violation-increment: 1.0
  # Kept for backward compatibility with older configs. Active violations now use
  # Grim-style timestamped expiry from punishments.groups.*.
  violation-decay-per-tick: 0.005
  # Prevent unbounded VL growth during long sessions.
  maximum-violation-level: 100.0
  # Alert on every active VL: 1, 2, 3, ...
  # This follows the same threshold:interval rule model as Grim, but keeps
  # operator alerts immediate instead of waiting for a 100 VL milestone.
  violation-alert-threshold: 1.0
  violation-alert-interval: 1.0

punishments:
  # Grim-style active violation window. A violation is removed after this many seconds
  # for every check group unless the group overrides it.
  remove-violations-after-seconds: 300
  # Each group supplies the checks it owns plus threshold:interval rules.
  # [alert] uses the first rule; [log] records every hard IMPOSSIBLE flag by default.
  groups:
    Blatant:
      remove-violations-after-seconds: 300
      # These are independently deterministic contradictions, not probabilistic
      # movement reachability. Keep their operator alert path immediate while
      # preserving Grim's higher Simulation threshold for ordinary reachability.
      checks:
        - "Flight"
        - "Step"
        - "Speed"
        - "Jesus"
        - "NoFall"
        - "FastBreak"
        - "FarBreak"
        - "FarPlace"
      alert: "1:1"
      log: "1:1"
    Simulation:
      remove-violations-after-seconds: 300
      checks:
        - "MOVEMENT_REACHABILITY"
        - "GroundSpoof"
        - "Flight"
        - "Jesus"
        - "Step"
        - "Speed"
        - "TimerBurst"
        - "TimerLimit"
        - "NoFall"
      alert: "1:1"
      log: "1:1"
    Knockback:
      remove-violations-after-seconds: 300
      checks:
        - "Knockback"
        - "Explosion"
      alert: "1:1"
      log: "1:1"
    Post:
      remove-violations-after-seconds: 300
      checks:
        - "Post"
      alert: "1:1"
      log: "1:1"
    BadPackets:
      remove-violations-after-seconds: 300
      checks:
        - "BadPackets"
        - "PacketPosition"
        - "PacketRotation"
        - "EntityAction"
        - "HeldItemSlot"
        - "InventorySlot"
        - "InventoryClickType"
        - "InventoryButton"
        - "BlockPlaceCursor"
        - "BlockPlaceFace"
        - "PacketOrder"
        - "Crash"
      alert: "20:20"
      log: "1:1"
    Reach:
      remove-violations-after-seconds: 300
      checks:
        - "Reach"
      alert: "1:1"
      log: "1:1"
    Hitboxes:
      remove-violations-after-seconds: 300
      checks:
        - "Hitbox"
      alert: "5:3"
      log: "1:1"
    Misc:
      remove-violations-after-seconds: 300
      checks:
        - "Vehicle"
        - "NoSlow"
        - "Sprint"
        - "MultiActions"
        - "Place"
        - "Baritone"
        - "Break"
        - "TransactionOrder"
        - "Elytra"
        - "Chat"
        - "Exploit"
        - "FarBreak"
        - "FarPlace"
        - "FastBreak"
      alert: "1:1"
      log: "1:1"
    Combat:
      remove-violations-after-seconds: 300
      checks:
        - "Interact"
        - "Aim"
        - "AimModulo360"
      alert: "1:1"
      log: "1:1"
    Autoclicker:
      remove-violations-after-seconds: 300
      checks:
        - "Autoclicker"
      alert: "20:40"
      log: "1:1"

debug:
  # Targeted Phase 8 diagnostics are disabled by default. Use /phantom debug <player> at runtime.
  phase8: false
  # Maximum interval between repeated targeted diagnostics for one player.
  summary-interval-seconds: 5

enforcement:
  # All punitive actions remain disabled by default.
  kick-enabled: false
  punishment-enabled: false
  punishment-command: "warn {player} Phantom movement evidence"
  # Active-VL thresholds mirror Grim's separation between check setbacks and punishment commands.
  # One exhaustive IMPOSSIBLE result immediately raises VL; these thresholds only control enforcement actions.
  setback-violation-level: 10.0
  kick-violation-level: 100.0
  punishment-violation-level: 100.0
  minimum-confidence: 1.0
  only-when-exhaustive: true
  permission-exempt: true
  permission: phantom.exempt
validation:
  candidate-budget: 4096
  interval-ticks: 1

setbacks:
  # Optional strict debug mode. Only exhaustively-impossible movements are restored.
  enabled: false
  # Never setback from a verdict produced by an incomplete timing/world search.
  only-when-exhaustive: true

checks:
  # Packet checks are evidence-only. Punishment groups above control the active
  # violation window and alert/log thresholds.
  enabled: true
  alert-violation-threshold: 1.0
  violation-increment: 1.0
  violation-decay-per-tick: 0.005
  maximum-violation-level: 100.0
  violation-alert-interval: 1.0
  reset-after-ticks: 40
  alert-debounce-ticks: 0
  # Vanilla 1.21.11 interaction envelopes; creative attributes may be narrower/broader
  # in future versions, so checks stay conservative until those attributes are wired.
  attack-reach: 4.0
  block-interaction-reach: 5.0
  # Conservative timer detector: 20 client tick boundaries inside 250 ms (~80 TPS).
  timer-enabled: true
  timer-window-ticks: 20
  timer-window-nanos: 250000000
