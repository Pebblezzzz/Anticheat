alerts:
  enabled: true
  broadcast: false
debug:
  # Temporary live Phase 8 diagnostics. Disable after the movement pipeline is verified.
  phase8: true
enforcement:
  # Disabled by default. Enable only in a controlled test server after reviewing evidence.
  kick-enabled: false
  minimum-confidence: 0.90
  permission-exempt: true
  permission: phantom.exempt
validation:
  candidate-budget: 4096
  interval-ticks: 10
