alerts:
  # Staff alerts are opt-in by permission unless broadcast is enabled.
  enabled: true
  broadcast: false
  print-to-console: true
  permission: phantom.alerts
  # Minimum server ticks between repeated alerts for the same player/check.
  alert-interval-ticks: 2
  # VL added by each exhaustively-impossible observation.
  violation-increment: 1.0
  # VL decays continuously with server time; 0.005 is 1 VL per 200 ticks.
  violation-decay-per-tick: 0.005
  # Prevent unbounded VL growth during long sessions.
  maximum-violation-level: 100.0
  # Alert when VL reaches this level, then every this many additional VL.
  # Matches Grim's Simulation-style persistence model rather than a fixed
  # "N impossible packets" alert gate.
  violation-alert-threshold: 100.0
  violation-alert-interval: 40.0

debug:
  # Targeted Phase 8 diagnostics are disabled by default. Use /phantom debug <player> at runtime.
  phase8: false
  # Maximum interval between repeated targeted diagnostics for one player.
  summary-interval-seconds: 5

enforcement:
  # All punitive actions remain disabled by default.
  kick-enabled: false
  punishment-enabled: false
  punishment-command: "warn {player} Phantom movement evidence"
  # Enforcement remains stricter than operator alerts and is disabled by default.
  # This is not the staff-alert threshold; alerts use the VL buffer above.
  minimum-impossible-observations: 3
  minimum-confidence: 1.0
  only-when-exhaustive: true
  permission-exempt: true
  permission: phantom.exempt
validation:
  candidate-budget: 4096
  interval-ticks: 1

setbacks:
  # Optional strict debug mode. Only exhaustively-impossible movements are restored.
  enabled: false
  # Never setback from a verdict produced by an incomplete timing/world search.
  only-when-exhaustive: true

checks:
  # Packet checks are evidence-only and use the same VL persistence model as Grim.
  enabled: true
  alert-violation-threshold: 100.0
  violation-increment: 1.0
  violation-decay-per-tick: 0.005
  maximum-violation-level: 100.0
  violation-alert-interval: 40.0
  reset-after-ticks: 40
  alert-debounce-ticks: 20
  # Vanilla 1.21.11 interaction envelopes; creative attributes may be narrower/broader
  # in future versions, so checks stay conservative until those attributes are wired.
  attack-reach: 4.0
  block-interaction-reach: 5.0
  # Conservative timer detector: 20 client tick boundaries inside 250 ms (~80 TPS).
  timer-enabled: true
  timer-window-ticks: 20
  timer-window-nanos: 250000000
