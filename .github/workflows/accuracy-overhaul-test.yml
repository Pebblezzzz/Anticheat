name: accuracy-overhaul-test
on:
  push:
    branches:
      - accuracy-overhaul-2026-10-05
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven tests
        run: mvn -B -ntp clean test 2>&1 | tee maven-test.log
      - name: Upload Maven diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-overhaul-maven-diagnostics
          path: |
            maven-test.log
            target/surefire-reports/**
            target/test-classes/**
          if-no-files-found: warn
