name: Full suite verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/**]

permissions:
  contents: read

jobs:
  full-maven-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run complete Maven suite without output-pipeline masking
        run: mvn -B -ntp clean test
# CI trigger for PR #220 verification and movement matrix coverage.
