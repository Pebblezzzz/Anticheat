import java.io.*;
import java.nio.charset.StandardCharsets;
import java.util.*;

/** One deterministic capture artifact spanning Phases 1-7; no JVM object serialization is used for the wire format. */
public record PipelineReplay(String schemaVersion,Timeline.Snapshot timeline,State.Seed seed,Phase7Timing.Config timingConfig,int maximumCandidates) implements Serializable {
  public static final String SCHEMA_VERSION="pipeline-replay-v1";
  private static final int MAGIC=0x50315250; private static final short FORMAT_VERSION=1;
  public PipelineReplay { if(!SCHEMA_VERSION.equals(schemaVersion))throw new IllegalArgumentException("unsupported pipeline replay schema");Objects.requireNonNull(timeline);Objects.requireNonNull(seed);Objects.requireNonNull(timingConfig);if(maximumCandidates<1)throw new IllegalArgumentException("maximumCandidates must be positive"); }
  public static PipelineReplay of(Timeline.Snapshot timeline,State.Seed seed,Phase7Timing.Config timingConfig,int maximumCandidates){return new PipelineReplay(SCHEMA_VERSION,timeline,seed,timingConfig,maximumCandidates);}
  public Result replay(){State.Reconstruction playerHistory=State.reconstruct(seed,timeline);World.VisibilityHistory worldHistory=World.fromTimeline(timeline);Phase7Timing.Reconstruction timing=Phase7Timing.reconstruct(timeline,timingConfig);LiveValidation.Report validation=LiveValidation.analyze(timeline,maximumCandidates,timingConfig);return new Result(timeline,playerHistory,worldHistory,timing,validation,Timeline.projectInputs(timeline));}
  public byte[] encode(){byte[] timelineBytes=new Timeline.Codec().encode(timeline);try(var bytes=new ByteArrayOutputStream();var out=new DataOutputStream(bytes)){out.writeInt(MAGIC);out.writeShort(FORMAT_VERSION);out.writeInt(timelineBytes.length);out.write(timelineBytes);writePlayer(out,seed.player());out.writeInt(seed.known().size());seed.known().stream().map(Enum::name).sorted().forEach(v->{try{writeString(out,v);}catch(IOException e){throw new UncheckedIOException(e);}});writeString(out,seed.environment().name());writeConfig(out,timingConfig);out.writeInt(maximumCandidates);out.flush();return bytes.toByteArray();}catch(UncheckedIOException e){throw new IllegalStateException(e.getCause());}catch(IOException e){throw new IllegalStateException(e);}}
  public static PipelineReplay decode(byte[] bytes){try(var in=new DataInputStream(new ByteArrayInputStream(bytes))){if(in.readInt()!=MAGIC||in.readUnsignedShort()!=FORMAT_VERSION)throw new IllegalArgumentException("unsupported pipeline replay format");int len=in.readInt();if(len<0||len>64*1024*1024)throw new IllegalArgumentException("invalid timeline length");byte[] timelineBytes=in.readNBytes(len);if(timelineBytes.length!=len)throw new EOFException("truncated timeline");Timeline.Snapshot timeline=new Timeline.Codec().decode(timelineBytes);State.Player player=readPlayer(in);int knownCount=in.readInt();if(knownCount<0||knownCount>64)throw new IllegalArgumentException("invalid known-fact count");EnumSet<State.Fact> known=EnumSet.noneOf(State.Fact.class);for(int i=0;i<knownCount;i++)known.add(State.Fact.valueOf(readString(in)));State.Environment environment=State.Environment.valueOf(readString(in));Phase7Timing.Config config=readConfig(in);int max=in.readInt();if(in.available()!=0)throw new IllegalArgumentException("trailing pipeline replay data");return of(timeline,new State.Seed(player,known,environment),config,max);}catch(EOFException e){throw new IllegalArgumentException("truncated pipeline replay",e);}catch(IOException|IllegalArgumentException e){throw new IllegalArgumentException("invalid pipeline replay",e);}}
  public record Result(Timeline.Snapshot timeline,State.Reconstruction playerHistory,World.VisibilityHistory worldHistory,Phase7Timing.Reconstruction timing,LiveValidation.Report validation,List<Timeline.InputSample> simulationInputs) implements Serializable{}
  private static void writePlayer(DataOutputStream out,State.Player p)throws IOException{writeVec(out,p.position());writeVec(out,p.velocity());out.writeFloat(p.yaw());out.writeFloat(p.pitch());out.writeBoolean(p.onGround());writeString(out,p.gamemode());out.writeInt(p.effects().size());for(var e:new TreeMap<>(p.effects()).entrySet()){writeString(out,e.getKey());out.writeInt(e.getValue());}out.writeBoolean(p.awaitingTeleport().isPresent());if(p.awaitingTeleport().isPresent())out.writeInt(p.awaitingTeleport().getAsInt());out.writeBoolean(p.uncertain());out.writeBoolean(p.input().isPresent());if(p.input().isPresent()){var i=p.input().get();out.writeInt(i.forward());out.writeInt(i.strafe());out.writeBoolean(i.jump());out.writeBoolean(i.sprint());out.writeBoolean(i.sneak());}out.writeDouble(p.attributes().movementSpeed());out.writeInt(p.attributes().modifiers().size());for(var m:p.attributes().modifiers()){writeString(out,m.id());out.writeDouble(m.amount());writeString(out,m.operation().name());}writeString(out,p.pose().name());writeString(out,p.environment().name());out.writeLong(p.clientTickRange().min());out.writeLong(p.clientTickRange().max());out.writeBoolean(p.clientTickRange().exact());out.writeLong(p.provenance().sequence());out.writeLong(p.provenance().serverTick());writeString(out,p.provenance().packetType());out.writeInt(p.uncertaintyReasons().size());p.uncertaintyReasons().stream().map(Enum::name).sorted().forEach(v->{try{writeString(out,v);}catch(IOException e){throw new UncheckedIOException(e);}});}
  private static State.Player readPlayer(DataInputStream in)throws IOException{var pos=readVec(in);var vel=readVec(in);float yaw=in.readFloat(),pitch=in.readFloat();boolean ground=in.readBoolean();String gm=readString(in);int effects=in.readInt();Map<String,Integer> map=new HashMap<>();for(int i=0;i<effects;i++)map.put(readString(in),in.readInt());OptionalInt tp=in.readBoolean()?OptionalInt.of(in.readInt()):OptionalInt.empty();boolean uncertain=in.readBoolean();Optional<Simulation.AdvancedInput> input=in.readBoolean()?Optional.of(new Simulation.AdvancedInput(in.readInt(),in.readInt(),in.readBoolean(),in.readBoolean(),in.readBoolean())):Optional.empty();double speed=in.readDouble();int mods=in.readInt();List<Phase5Mechanics.AttributeModifier> modifiers=new ArrayList<>();for(int i=0;i<mods;i++)modifiers.add(new Phase5Mechanics.AttributeModifier(readString(in),in.readDouble(),Phase5Mechanics.ModifierOperation.valueOf(readString(in))));Phase5Mechanics.Pose pose=Phase5Mechanics.Pose.valueOf(readString(in));State.Environment env=State.Environment.valueOf(readString(in));State.TickRange ticks=new State.TickRange(in.readLong(),in.readLong(),in.readBoolean());State.Provenance provenance=new State.Provenance(in.readLong(),in.readLong(),readString(in));int ur=in.readInt();EnumSet<State.UncertaintyReason> reasons=EnumSet.noneOf(State.UncertaintyReason.class);for(int i=0;i<ur;i++)reasons.add(State.UncertaintyReason.valueOf(readString(in)));return new State.Player(pos,vel,yaw,pitch,ground,gm,map,tp,uncertain,input,new Simulation.Attributes(speed,modifiers),pose,env,ticks,provenance,reasons);}
  private static void writeConfig(DataOutputStream out,Phase7Timing.Config c)throws IOException{out.writeLong(c.serverTickNanos());out.writeLong(c.clientTickMinNanos());out.writeLong(c.clientTickMaxNanos());out.writeLong(c.upstreamLatency().minNanos());out.writeLong(c.upstreamLatency().maxNanos());out.writeLong(c.downstreamLatency().minNanos());out.writeLong(c.downstreamLatency().maxNanos());out.writeLong(c.inputToSimulation().minTicks());out.writeLong(c.inputToSimulation().maxTicks());out.writeLong(c.simulationToPacket().minTicks());out.writeLong(c.simulationToPacket().maxTicks());out.writeLong(c.packetGapThresholdNanos());out.writeInt(c.recoveryStableEvents());out.writeInt(c.maxTimingCandidates());}
  private static Phase7Timing.Config readConfig(DataInputStream in)throws IOException{return new Phase7Timing.Config(in.readLong(),in.readLong(),in.readLong(),new Phase7Timing.LatencyBounds(in.readLong(),in.readLong()),new Phase7Timing.LatencyBounds(in.readLong(),in.readLong()),new Phase7Timing.TickDelayBounds(in.readLong(),in.readLong()),new Phase7Timing.TickDelayBounds(in.readLong(),in.readLong()),in.readLong(),in.readInt(),in.readInt());}
  private static void writeVec(DataOutputStream out,Maths.Vec3 v)throws IOException{out.writeDouble(v.x());out.writeDouble(v.y());out.writeDouble(v.z());} private static Maths.Vec3 readVec(DataInputStream in)throws IOException{return new Maths.Vec3(in.readDouble(),in.readDouble(),in.readDouble());}
  private static void writeString(DataOutputStream out,String v)throws IOException{byte[] b=v.getBytes(StandardCharsets.UTF_8);if(b.length>1_000_000)throw new IllegalArgumentException("string too large");out.writeInt(b.length);out.write(b);} private static String readString(DataInputStream in)throws IOException{int n=in.readInt();if(n<0||n>1_000_000)throw new IOException("invalid string length");return new String(in.readNBytes(n),StandardCharsets.UTF_8);} }
