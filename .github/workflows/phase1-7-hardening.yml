import java.util.*;import static dev.phantom.ac.Maths.*;import static dev.phantom.ac.Packets.*;
/** Synthetic packet/timeline benchmark. It is not a real-server performance claim. */
public final class Phase1PerformanceBenchmark { private Phase1PerformanceBenchmark(){} public record Result(long nanos,int events,int duplicates,int sequenceGaps,int outOfOrder,int serverTicks){} public static Result benchmark(int events){if(events<1)throw new IllegalArgumentException("events must be positive");List<RawPacket> raw=new ArrayList<>(events);for(int i=0;i<events;i++){long seq=i+1L;long receive=(i%7==0?i*50_000_000L+20_000_000L:i*50_000_000L);raw.add(new RawPacket(seq,receive,new Move(new Vec3(i*.01,64,i*.02),0f,0f,true,(long)i)));}Collections.reverse(raw);long start=System.nanoTime();Timeline.Snapshot timeline=Timeline.assign(new Normalizer().normalize(raw),0,50_000_000L);long elapsed=System.nanoTime()-start;Timeline.Integrity integrity=Timeline.inspect(timeline);return new Result(elapsed,integrity.events(),integrity.duplicatePackets(),integrity.sequenceGaps(),integrity.outOfOrderPackets(),timeline.events().stream().map(Timeline.Event::serverTick).collect(java.util.stream.Collectors.toSet()).size());}public static Result benchmark(){return benchmark(100_000);}}
