    if(packet instanceof TeleportConfirm c){boolean matches=state.awaitingTeleport().isPresent()&&state.awaitingTeleport().getAsInt()==c.id();if(!matches){reasons.add(UncertaintyReason.MISMATCHED_TELEPORT_ACK);uncertain=true;}else{reasons.remove(UncertaintyReason.TELEPORT_CORRECTION);}return new Player(state.position(),state.velocity(),state.yaw(),state.pitch(),state.onGround(),state.gamemode(),state.effects(),matches?OptionalInt.empty():state.awaitingTeleport(),uncertain,state.input(),state.attributes(),state.pose(),state.environment(),state.clientTickRange(),new Provenance(event.sequence(),0,"TeleportConfirm"),reasons);}
