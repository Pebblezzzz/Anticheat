name: Phase 1-7 hardening gate

on:
  push:
    branches: ["phase1-7-hardening-2026-09-17"]
  pull_request:
    branches: ["main"]

jobs:
  core-maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run full Maven suite
        run: mvn -B package

  vanilla-capture-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vanilla-trace-capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Build observation-only 1.21.11 capture harness
        run: gradle build
