    Objects.requireNonNull(state);Objects.requireNonNull(event);Packet packet=event.packet();EnumSet<PacketFlag> flags=event.flags();Player current=state;EnumSet<UncertaintyReason> reasons=EnumSet.noneOf(UncertaintyReason.class);reasons.addAll(state.uncertaintyReasons());if(flags.contains(PacketFlag.DUPLICATE))reasons.add(UncertaintyReason.DUPLICATE_PACKET);if(flags.contains(PacketFlag.OUT_OF_ORDER))reasons.add(UncertaintyReason.OUT_OF_ORDER);if(flags.contains(PacketFlag.SEQUENCE_GAP))reasons.add(UncertaintyReason.SEQUENCE_GAP);if(flags.contains(PacketFlag.BEFORE_CAPTURE_EPOCH))reasons.add(UncertaintyReason.BEFORE_CAPTURE_EPOCH);boolean uncertain=state.uncertain()||!reasons.isEmpty();
    if(packet instanceof Move move){
      Vec3 position=move.position()==null?state.position():move.position();float yaw=move.yaw()==null?state.yaw():move.yaw();float pitch=move.pitch()==null?state.pitch():move.pitch();boolean ground=move.onGround()==null?state.onGround():move.onGround();if(move.onGround()==null){reasons.add(UncertaintyReason.MISSING_GROUND_BIT);uncertain=true;}if(move.clientTick()==null){reasons.add(UncertaintyReason.UNKNOWN_CLIENT_TICK);}TickRange ticks=move.clientTick()==null?state.clientTickRange():TickRange.exact(move.clientTick());return new Player(position,state.velocity(),yaw,pitch,ground,state.gamemode(),state.effects(),state.awaitingTeleport(),uncertain,state.input(),state.attributes(),state.pose(),state.environment(),ticks,new Provenance(event.sequence(),0,"Move"),reasons);
    }
