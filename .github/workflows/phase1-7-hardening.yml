  public record TickRange(long min,long max,boolean exact) implements Serializable { public TickRange{if(min<0||max<min)throw new IllegalArgumentException("invalid tick range");} public static TickRange exact(long tick){return new TickRange(tick,tick,true);} public static TickRange unknown(){return new TickRange(0,Long.MAX_VALUE,false);} }
