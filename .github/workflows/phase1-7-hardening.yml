          Path('docs/PHASE1-7-HARDENING.md').write_text('''# Phases 1-7 internal hardening\n\nThis change closes the internal architectural gaps identified in the Phase 1-7 audit without inventing any Minecraft empirical evidence.\n\n## Closed internally\n\n- Packet captures now carry explicit immutable capture provenance and optional authoritative server-tick association; the timeline uses an authoritative tick when supplied and otherwise uses deterministic timestamp projection.\n- Timeline replay format version 2 preserves provenance and authoritative tick metadata and remains able to decode version 1 recordings.\n- `State.Player` is now one immutable rich movement-state model carrying input, attributes, pose, environment, client tick range, provenance, correction state, and structured uncertainty.\n- `Simulation.Vanilla12111Physics` is a compatibility adapter; movement mechanics are owned by `Vanilla12111RichPhysics`.\n- Entity collision is part of the canonical rich-physics context. Incomplete entity history is uncertainty; complete recorded entity boxes participate in axis clipping.\n- The legacy reachability API delegates to `Phase6Reachability`; it no longer contains a second physics/search implementation.\n- `PipelineReplay` packages the canonical timeline, PlayerState seed, Phase 7 timing configuration and candidate budget, and deterministically reconstructs PlayerState history, client-visible world history, Phase 7 synchronization, simulation-input projection, and the existing validation bridge.\n- Adversarial packet ordering, provenance/tick preservation, pipeline replay determinism, entity-collision uncertainty and synthetic packet/timeline benchmarking are regression-tested.\n\n## External-data boundary intentionally unchanged\n\nThe real Minecraft Java Edition 1.21.11 client corpus is still required for empirical vanilla validation of movement constants, collision behavior, packet-generation timing, latency/jitter distributions, acknowledgement timing, and client-tick alignment. No synthetic artifact in this hardening change is presented as vanilla evidence.\n''',encoding='utf-8')

