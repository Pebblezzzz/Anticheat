          old = 'private static void writeEvent(DataOutputStream out,Event event)throws IOException{out.writeLong(event.serverTick());NormalizedPacket p=event.packet();out.writeLong(p.sequence());out.writeLong(p.receivedNanos());out.writeInt(flags(p.flags()));writePacket(out,p.packet());}'
          new = '''private static void writeEvent(DataOutputStream out,Event event,int formatVersion)throws IOException{out.writeLong(event.serverTick());NormalizedPacket p=event.packet();out.writeLong(p.sequence());out.writeLong(p.receivedNanos());out.writeInt(flags(p.flags()));if(formatVersion>=2)writeProvenance(out,p.provenance());writePacket(out,p.packet());}'''
          text = text.replace(old,new,1)
          old = 'private static Event readEvent(DataInputStream in)throws IOException{long tick=in.readLong(),seq=in.readLong(),nanos=in.readLong();EnumSet<PacketFlag> flags=readFlags(in.readInt());return new Event(tick,new NormalizedPacket(seq,nanos,readPacket(in),flags));}'
          new = '''private static Event readEvent(DataInputStream in,int formatVersion)throws IOException{long tick=in.readLong(),seq=in.readLong(),nanos=in.readLong();EnumSet<PacketFlag> flags=readFlags(in.readInt());CaptureProvenance provenance=formatVersion>=2?readProvenance(in):null;Packet packet=readPacket(in);return new Event(tick,new NormalizedPacket(seq,nanos,packet,flags,provenance));}
    private static void writeProvenance(DataOutputStream out,CaptureProvenance p)throws IOException{writeString(out,p.sourceId());writeString(out,p.direction());writeString(out,p.packetType());writeNullableLong(out,p.authoritativeServerTick());}
    private static CaptureProvenance readProvenance(DataInputStream in)throws IOException{return new CaptureProvenance(readString(in),readString(in),readString(in),readNullableLong(in));}'''
          text = text.replace(old,new,1)
          old = 'for(NormalizedPacket packet:packets){EnumSet<PacketFlag> flags=packet.flags();long tick;if(packet.receivedNanos()<epochNanos){flags.add(PacketFlag.BEFORE_CAPTURE_EPOCH);tick=0;}else tick=(packet.receivedNanos()-epochNanos)/tickNanos;events.add(new Event(tick,new NormalizedPacket(packet.sequence(),packet.receivedNanos(),packet.packet(),flags)));}'
          new = 'for(NormalizedPacket packet:packets){EnumSet<PacketFlag> flags=packet.flags();long tick;if(packet.receivedNanos()<epochNanos){flags.add(PacketFlag.BEFORE_CAPTURE_EPOCH);tick=0;}else if(packet.provenance().authoritativeServerTick()!=null)tick=packet.provenance().authoritativeServerTick();else tick=(packet.receivedNanos()-epochNanos)/tickNanos;events.add(new Event(tick,new NormalizedPacket(packet.sequence(),packet.receivedNanos(),packet.packet(),flags,packet.provenance())));}'
          text = text.replace(old,new,1)
