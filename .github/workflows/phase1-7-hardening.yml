name: phase1-7-hardening

on:
  push:
    branches: ["phase1-7-hardening-2026-09-17"]

permissions:
  contents: write

jobs:
  harden-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Apply Phase 1-7 architectural hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')
          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def matching_brace(text, start):
              depth = 0
              i = start
              state = 'code'
              while i < len(text):
                  c = text[i]
                  n = text[i+1] if i + 1 < len(text) else ''
                  if state == 'code':
                      if c == '"': state = 'string'
                      elif c == "'": state = 'char'
                      elif c == '/' and n == '/': state = 'line'; i += 1
                      elif c == '/' and n == '*': state = 'block'; i += 1
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0: return i
                  elif state == 'string':
                      if c == '\\\\': i += 1
                      elif c == '"': state = 'code'
                  elif state == 'char':
                      if c == '\\\\': i += 1
                      elif c == "'": state = 'code'
                  elif state == 'line':
                      if c == '\n': state = 'code'
                  else:
                      if c == '*' and n == '/': state = 'code'; i += 1
                  i += 1
              raise RuntimeError('unbalanced braces')

          def replace_block(text, token, replacement):
              start = text.index(token)
              brace = text.index('{', start)
              end = matching_brace(text, brace) + 1
              return text[:start] + replacement + text[end:]

          # ---------------- Packets: explicit provenance + authoritative tick ----------------
          p = 'src/main/java/dev/phantom/ac/Packets.java'
          text = read(p)
          if 'public record CaptureProvenance' not in text:
              marker = '  public record RawPacket('
              provenance = '''  /** Capture-side provenance. Protocol sequence/tick values are optional because many adapters do not expose them. */
              public record CaptureProvenance(String sourceId,String direction,String packetType,Long authoritativeServerTick) implements Serializable {
                public CaptureProvenance {
                  if(sourceId==null||sourceId.isBlank()) throw new IllegalArgumentException("sourceId is required");
                  if(direction==null||direction.isBlank()) throw new IllegalArgumentException("direction is required");
                  if(packetType==null||packetType.isBlank()) throw new IllegalArgumentException("packetType is required");
                  if(authoritativeServerTick!=null&&authoritativeServerTick<0) throw new IllegalArgumentException("authoritativeServerTick must be non-negative");
                }
                public static CaptureProvenance forPacket(Packet packet){
                  Objects.requireNonNull(packet);
                  String direction = directionFor(packet);
                  return new CaptureProvenance("unknown-capture-source",direction,packet.getClass().getSimpleName(),null);
                }
                public static String directionFor(Packet packet){
                  if(packet instanceof Move||packet instanceof ClientInput||packet instanceof TeleportConfirm) return "CLIENT_TO_SERVER";
                  if(packet instanceof Teleport||packet instanceof Velocity||packet instanceof Effect||packet instanceof Gamemode||packet.mutatesWorld()) return "SERVER_TO_CLIENT";
                  return "UNKNOWN";
                }
              }

'''
              text = text.replace(marker, provenance + marker, 1)
          old = 'public record RawPacket(long sequence, long receivedNanos, Packet packet) implements Serializable { public RawPacket { if(sequence<0||receivedNanos<0) throw new IllegalArgumentException("sequence and receivedNanos must be non-negative"); Objects.requireNonNull(packet,"packet"); } }'
          new = '''public record RawPacket(long sequence,long receivedNanos,Packet packet,CaptureProvenance provenance,Long authoritativeServerTick) implements Serializable {
            public RawPacket { if(sequence<0||receivedNanos<0) throw new IllegalArgumentException("sequence and receivedNanos must be non-negative"); Objects.requireNonNull(packet,"packet"); provenance=provenance==null?CaptureProvenance.forPacket(packet):provenance; if(authoritativeServerTick!=null&&authoritativeServerTick<0) throw new IllegalArgumentException("authoritativeServerTick must be non-negative"); }
            public RawPacket(long sequence,long receivedNanos,Packet packet){this(sequence,receivedNanos,packet,CaptureProvenance.forPacket(packet),null);}
          }'''
          text = text.replace(old,new,1)
          old = 'public record NormalizedPacket(long sequence, long receivedNanos, Packet packet, EnumSet<PacketFlag> flags) implements Serializable { public NormalizedPacket { if(sequence<0||receivedNanos<0) throw new IllegalArgumentException("sequence and receivedNanos must be non-negative"); Objects.requireNonNull(packet,"packet"); flags=flags==null?EnumSet.noneOf(PacketFlag.class):EnumSet.copyOf(flags); if(flags.isEmpty()) flags=EnumSet.of(PacketFlag.NORMAL); } @Override public EnumSet<PacketFlag> flags(){return EnumSet.copyOf(flags);} }'
          new = '''public record NormalizedPacket(long sequence,long receivedNanos,Packet packet,EnumSet<PacketFlag> flags,CaptureProvenance provenance) implements Serializable {
            public NormalizedPacket { if(sequence<0||receivedNanos<0) throw new IllegalArgumentException("sequence and receivedNanos must be non-negative"); Objects.requireNonNull(packet,"packet"); flags=flags==null?EnumSet.noneOf(PacketFlag.class):EnumSet.copyOf(flags); if(flags.isEmpty()) flags=EnumSet.of(PacketFlag.NORMAL); provenance=provenance==null?CaptureProvenance.forPacket(packet):provenance; }
            public NormalizedPacket(long sequence,long receivedNanos,Packet packet,EnumSet<PacketFlag> flags){this(sequence,receivedNanos,packet,flags,CaptureProvenance.forPacket(packet));}
            @Override public EnumSet<PacketFlag> flags(){return EnumSet.copyOf(flags);}
          }'''
          text = text.replace(old,new,1)
          text = text.replace('public enum PacketFlag { NORMAL, DUPLICATE, OUT_OF_ORDER, SEQUENCE_GAP, BEFORE_CAPTURE_EPOCH }','public enum PacketFlag { NORMAL, DUPLICATE, OUT_OF_ORDER, SEQUENCE_GAP, BEFORE_CAPTURE_EPOCH }')
          old_norm = 'public static final class Normalizer implements Contracts.PacketNormalizer {'
          if old_norm in text:
              replacement = '''public static final class Normalizer implements Contracts.PacketNormalizer {
                public List<NormalizedPacket> normalize(Collection<RawPacket> raw) {
                  Objects.requireNonNull(raw,"raw packets");
                  List<RawPacket> ordered=raw.stream().sorted(Comparator.comparingLong(RawPacket::receivedNanos).thenComparingLong(RawPacket::sequence)).toList();
                  Set<Long> seen=new HashSet<>(); long highestSequence=-1; List<NormalizedPacket> result=new ArrayList<>();
                  for(RawPacket p:ordered){EnumSet<PacketFlag> f=EnumSet.of(PacketFlag.NORMAL);if(!seen.add(p.sequence()))f.add(PacketFlag.DUPLICATE);if(highestSequence>=0&&p.sequence()<highestSequence)f.add(PacketFlag.OUT_OF_ORDER);if(highestSequence>=0&&p.sequence()>highestSequence+1)f.add(PacketFlag.SEQUENCE_GAP);highestSequence=Math.max(highestSequence,p.sequence());result.add(new NormalizedPacket(p.sequence(),p.receivedNanos(),p.packet(),f,p.provenance()));}
                  return List.copyOf(result);
