name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/**]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: mvn -q test 2>&1 | tee tests-workflow.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-workflow-diagnostics
          path: |
            tests-workflow.log
            target/surefire-reports/**
          if-no-files-found: warn
