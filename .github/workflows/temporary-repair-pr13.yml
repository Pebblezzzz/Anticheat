name: Temporary repair runner for PR 13

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 13 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply repair
        run: |
          python3 tools/apply-hardening.py
          python3 tools/fix-hardening-output.py
      - name: Verify repaired sources
        run: mvn -B test package
      - name: Commit repaired sources to PR branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/apply-hardening.py tools/fix-hardening-output.py .github/workflows/repair-hardening.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No repair changes generated.'
          else
            git commit -m 'Fix Phase 8 under-detection and live-state correctness'
            git push origin HEAD:"$BRANCH"
          fi
      - name: Remove temporary runner from main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          rm -f .github/workflows/temporary-repair-pr13.yml
          git add -A
          git commit -m 'Remove temporary repair runner' || true
          git push origin main
