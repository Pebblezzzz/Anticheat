name: Temporary repair runner for PR 13

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Fix Phase 8 under-detection and live-state correctness' && github.event.head_commit.message != 'Remove temporary repair runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Get repair scripts from PR branch
        run: |
          git fetch origin phase8-hardening-2026-09-17
          git checkout origin/phase8-hardening-2026-09-17 -- tools/apply-hardening.py tools/fix-hardening-output.py
      - name: Apply repair
        run: |
          python3 tools/apply-hardening.py
          python3 tools/fix-hardening-output.py
      - name: Verify repaired main
        run: mvn -B test package
      - name: Commit repaired main
        run: |
          rm -f tools/apply-hardening.py tools/fix-hardening-output.py .github/workflows/repair-hardening.yml .github/workflows/temporary-repair-pr13.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Phase 8 under-detection and live-state correctness'
          git push origin main
