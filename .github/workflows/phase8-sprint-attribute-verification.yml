name: Phase 8 sprint attribute verification

on:
  push:
    branches: [fix/phase8-paper-sprint-attribute]
    paths-ignore:
      - ci-proof-phase8-sprint.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run complete Maven suite without output-pipeline masking
        run: mvn -B -ntp clean test
      - name: Record verified test result
        run: |
          printf '%s\n' 'Maven clean test passed for Phase 8 sprint attribute fix.' > ci-proof-phase8-sprint.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-proof-phase8-sprint.txt
          git commit -m 'ci: record successful Phase 8 verification'
          git push
