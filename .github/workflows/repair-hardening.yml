name: Repair hardening branch

on:
  push:
    branches: [ phase8-hardening-2026-09-17 ]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply hardening patch
        run: python3 tools/apply-hardening.py
      - name: Verify
        run: mvn -B test package
      - name: Commit repaired sources
        run: |
          rm -f tools/apply-hardening.py .github/workflows/repair-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes produced.'
            exit 0
          fi
          git commit -m 'Fix Phase 8 under-detection and live-state correctness'
          git push origin HEAD:phase8-hardening-2026-09-17
