name: Repair hardening branch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply hardening patch
        run: python3 tools/apply-hardening.py
      - name: Fix generated output
        run: python3 tools/fix-hardening-output.py
      - name: Verify
        run: mvn -B test package
      - name: Commit repaired sources
        run: |
          rm -f tools/apply-hardening.py tools/fix-hardening-output.py .github/workflows/repair-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes produced.'
            exit 0
          fi
          git commit -m 'Fix Phase 8 under-detection and live-state correctness'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
