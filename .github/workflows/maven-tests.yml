name: Maven tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run full test suite
        run: mvn -B -ntp clean test 2>&1 | tee maven-tests.log

      - name: Upload Maven diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-tests-diagnostics
          path: |
            maven-tests.log
            target/surefire-reports/**
          if-no-files-found: warn
